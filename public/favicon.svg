<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Matte Dark Carbon Squircle Base -->
  <rect 
    x="24" 
    y="24" 
    width="464" 
    height="464" 
    rx="104" 
    fill="#0a0f0d" 
    stroke="#10b981" 
    stroke-width="14"
  />

  <!-- Extra-Bold Minimalist Monogram: TCS -->
  <text 
    x="256" 
    y="312" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="182" 
    letter-spacing="2"
